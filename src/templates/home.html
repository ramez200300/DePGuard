<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DePGuard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">DePGuard</a>
      <a class="btn btn-outline-light btn-sm" href="/new">New scan</a>
    </div>
  </nav>
  <div class="container">
    <h1 class="h4 mb-3">Scans</h1>
    {% if scans %}
    <table class="table table-striped bg-white">
      <thead>
        <tr>
          <th>ID</th>
          <th>Target</th>
          <th>Type</th>
          <th>Date</th>
          <th>Findings</th>
        </tr>
      </thead>
      <tbody>
        {% for scan in scans %}
        <tr>
          <td><a href="/scan/{{ scan.id }}">{{ scan.id }}</a></td>
          <td class="text-break">{{ scan.value }}</td>
          <td>{{ scan.scan_type }}</td>
          <td>{{ scan.created_at }}</td>
          <td>{{ scan.total }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p>No scans yet. <a href="/new">Start a scan</a>.</p>
    {% endif %}
  </div>
</body>
</html>
