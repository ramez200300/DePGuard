<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New scan - DePGuard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">DePGuard</a>
      <a class="btn btn-outline-light btn-sm" href="/new">New scan</a>
    </div>
  </nav>
  <div class="container" style="max-width: 640px;">
    <h1 class="h4 mb-3">New scan</h1>
    {% if message %}
    <div class="alert alert-warning">{{ message }}</div>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label" for="url">URL</label>
        <input class="form-control" id="url" name="url" placeholder="https://example.com">
      </div>
      <div class="mb-3">
        <label class="form-label" for="manifest">Or upload a manifest</label>
        <input class="form-control" type="file" id="manifest" name="manifest" accept=".txt,.json">
        <div class="form-text">requirements.txt or package.json.</div>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="permission" name="permission">
        <label class="form-check-label" for="permission">I own this target or have permission to test it.</label>
      </div>
      <button class="btn btn-primary" type="submit">Run scan</button>
    </form>
  </div>
</body>
</html>
